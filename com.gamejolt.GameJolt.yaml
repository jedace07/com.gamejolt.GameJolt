id: com.gamejolt.GameJolt
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: game-jolt-client

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  # The game installer and launched games write to libraries in home or on mounted drives.
  - --filesystem=host
  # Theme detection.
  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-config/gtk-4.0:ro

modules:
  # Game Jolt only serves the client through expiring download links, so the
  # launcher downloads it on first run. The client's loader then updates it.
  - name: game-jolt-client
    buildsystem: simple
    build-commands:
      - install -Dm755 game-jolt-client.sh "$FLATPAK_DEST/bin/game-jolt-client"
      - install -Dm644 "$FLATPAK_ID.desktop" -t "$FLATPAK_DEST/share/applications/"
      - install -Dm644 "$FLATPAK_ID.metainfo.xml" -t "$FLATPAK_DEST/share/metainfo/"
      - install -Dm644 icon_512x512.png "$FLATPAK_DEST/share/icons/hicolor/512x512/apps/$FLATPAK_ID.png"
      - install -Dm644 LICENSE -t "$FLATPAK_DEST/share/licenses/$FLATPAK_ID/"
    sources:
      - type: file
        path: game-jolt-client.sh
      - type: file
        path: com.gamejolt.GameJolt.desktop
      - type: file
        path: com.gamejolt.GameJolt.metainfo.xml
      - type: file
        url: https://raw.githubusercontent.com/gamejolt/gamejolt/db91c7a4430f9e6bcccb405cddf8a415fb006e10/scripts/build/desktop-app/icons/mac.iconset/icon_512x512.png
        sha256: d99698a8a018457c066fb04eeadc3d39a2d8347d691e749e111a60d21c2a3c79
      - type: file
        url: https://raw.githubusercontent.com/gamejolt/gamejolt/db91c7a4430f9e6bcccb405cddf8a415fb006e10/LICENSE
        sha256: 809c62af2612c8a6a7fababc7375e5336c0263b48cae1b9df7d8cb9990cf5e91
